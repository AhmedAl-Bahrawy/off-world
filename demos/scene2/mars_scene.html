<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mars — Steel Planet</title>
<style>
:root{
  --bg:#080a1c; --panel:#0e1233; --line:#4b55c9; --text:#e6e9ff; --muted:#8e97d6;
  --accent:#44e3b8; --warn:#ff5d73; --energy:#ffb347; --oxy:#6fa8ff; --signal:#b78bff;
  --font-ui: "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
  --font-pixel: "Courier New", monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font-ui)}
body{overflow-x:hidden;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer}
#app{direction:ltr;display:grid;grid-template-columns:200px minmax(0,1fr) 240px;
  grid-template-areas:"top top top" "hud stage tools" "story story story";
  gap:10px;padding:10px;max-width:1500px;margin:0 auto;align-items:start}
#app > *{direction:ltr}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:10px}
.panel h3{margin:0 0 8px;font-size:14px;color:var(--accent)}
#topbar{grid-area:top;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tb-btns{display:flex;gap:6px}
.tb-btns button,.btn{background:#161b4a;color:var(--text);border:2px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px}
.tb-btns button:hover,.btn:hover{background:#1f2766}
.btn.primary{background:var(--accent);color:#04201a;border-color:var(--accent);font-weight:700}
.btn.primary:hover{background:#6bf0cc}
.btn[disabled]{opacity:.45;cursor:default}
.btn.soon{opacity:.6;border-style:dashed}
#stageLabel{color:var(--accent);font-weight:700}
#sceneName{color:var(--muted);font-size:14px}
#hudLeft{grid-area:hud;display:flex;flex-direction:column;gap:10px}
#toolsPanel{grid-area:tools}
#stageWrap{grid-area:stage;min-width:0}
#storyBox{grid-area:story}
.res{margin-bottom:9px}
.res-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px}
.seg{display:flex;gap:2px;direction:ltr}
.seg i{flex:1;height:10px;background:#1a1f4d;border:1px solid #2a3070;display:block}
.seg.energy i.on{background:var(--energy)}
.seg.oxygen i.on{background:var(--oxy)}
.seg.signal i.on{background:var(--signal)}
#dataCount{font-size:13px;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
#dataCount b{color:var(--accent)}
.pad{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.pad button{background:#161b4a;color:var(--text);border:2px solid var(--line);border-radius:8px;padding:10px 0;font-size:15px;touch-action:none}
.pad button:active{background:var(--accent);color:#04201a}
#screen{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:2px solid var(--line);border-radius:10px;overflow:hidden}
#game{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#bubbleHud{position:absolute;display:none;z-index:4;max-width:min(72%,360px);min-width:130px;padding:7px 9px;border:1px solid #44e3b8;border-radius:10px 10px 10px 3px;background:rgba(8,15,38,.93);box-shadow:0 0 14px rgba(68,227,184,.22);font:600 clamp(10px,2vw,14px)/1.35 "Courier New",monospace;pointer-events:none;transform:translate(-50%,-100%);white-space:normal}
#bubbleHud.thought{border-color:#b78bff;border-radius:14px;background:rgba(17,12,45,.88);box-shadow:0 0 18px rgba(183,139,255,.25)}
#bubbleHud .bubbleAlien{display:block;color:#8ffff0}
#bubbleHud.thought .bubbleAlien{color:#d7bdff}
#bubbleHud .bubbleEnglish{display:block;margin-top:3px;color:#d6ddff;font:italic 500 clamp(9px,1.8vw,12px)/1.3 var(--font-ui);opacity:0;transition:opacity .2s}
#bubbleHud .bubbleEnglish.visible{opacity:1}
 #objectiveBar[hidden]{display:none}
#objectiveBar{display:flex;align-items:center;gap:9px;margin-top:8px;min-height:42px;padding:7px 11px;border:1px solid rgba(68,227,184,.7);border-radius:8px;background:linear-gradient(100deg,rgba(12,27,50,.98),rgba(19,22,55,.94));box-shadow:inset 3px 0 var(--accent)}
#objectiveIcon{font-size:18px;color:var(--accent)}
#objectiveCopy{min-width:0;flex:1}
#objectiveLabel{display:block;font-weight:700;font-size:13px;line-height:1.25}
#objectiveMeta{display:block;color:var(--muted);font-size:11px;margin-top:2px}
#objectiveDistance{font:700 12px "Courier New",monospace;color:#a5ffe8;white-space:nowrap}
#objectiveBar.pulse{animation:objectivePulse .8s ease-in-out 2}
@keyframes objectivePulse{50%{box-shadow:0 0 20px rgba(68,227,184,.55),inset 3px 0 var(--accent);transform:translateY(-1px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(5,6,20,.84);z-index:5;padding:8px;overflow:auto}
#overlay.show{display:flex}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;z-index:7}
#fade.on{opacity:1}
#platformOverlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,6,20,.9);z-index:8;padding:8px}
#platformOverlay[hidden]{display:none}
#sysOverlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,6,20,.88);z-index:50;padding:12px}
#sysOverlay[hidden]{display:none}
.modal{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:14px;max-width:580px;width:100%;max-height:100%;overflow:auto}
.modal h2{margin:0 0 8px;font-size:18px;color:var(--accent)}
.modal h3{margin:0 0 8px;color:var(--accent)}
.muted{color:var(--muted);font-size:13px;line-height:1.7;margin:4px 0 10px}
#infoBar{margin-top:8px;min-height:38px;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;line-height:1.6}
#storyBox{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
#storyBox h3{margin:0 0 4px;color:var(--accent);font-size:16px}
#storyBox p{margin:0;line-height:1.8;font-size:15px}
#storyText{max-width:900px}
.tool{border:1px solid #2a3070;border-radius:8px;padding:8px;margin-bottom:8px;background:#0b0f2b}
.tool.target{border-color:var(--accent)}
.tool-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;direction:ltr;flex-direction:row-reverse;justify-content:flex-end}
.tool-n{background:var(--line);color:#fff;border-radius:50%;width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:12px}
.tool-state{font-size:12px;color:var(--muted);margin:4px 0}
.chips{display:flex;gap:4px;direction:ltr;margin:4px 0}
.chip{font-family:var(--font-pixel);background:#161b4a;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:14px}
.hl .chip,.chips.hl .chip{background:var(--accent);color:#04201a;border-color:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 8px;border-bottom:1px dashed #2a3070;font-size:14px;line-height:1.6}
.row .lab{color:var(--muted);white-space:nowrap}
.row .val{text-align:right;direction:ltr;flex:1}
.row.locked .val{font-family:var(--font-pixel);color:#6a72b8;letter-spacing:1px}
.row.pop{animation:popin .5s}
@keyframes popin{0%{background:var(--accent)}100%{background:transparent}}
.note{background:#1a1f4d;border:1px solid var(--accent);border-radius:8px;padding:8px;margin:8px 0;font-size:13px;line-height:1.7}
.cardtop{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.cardtop canvas{width:144px;height:96px;image-rendering:pixelated;background:#1a0f22;border:2px solid var(--line);border-radius:8px}
.slots,.tiles{display:flex;flex-wrap:wrap;gap:12px;direction:ltr;justify-content:center;margin:10px 0}
.wordgrp{display:flex;gap:4px}
.slot,.tile{font-family:var(--font-pixel);font-size:20px;font-weight:700;width:34px;height:40px;border-radius:6px;color:var(--text)}
.slot{background:#0b0f2b;border:2px dashed var(--line)}
.slot.full{border-style:solid;background:#161b4a}
.tile{background:#222a74;border:2px solid var(--line)}
.tile.used{opacity:.2;cursor:default}
.slots.ok .slot{background:var(--accent);color:#04201a;border-color:var(--accent)}
.slots.shake .slot{border-color:var(--warn);background:#3a1020;animation:shake .5s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.btnrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.coordlist{margin:8px 0;padding:0;list-style:none}
.coordlist li{padding:6px 8px;border-bottom:1px dashed #2a3070;font-size:14px}
.coordlist code{font-family:var(--font-pixel);color:var(--accent);direction:ltr;display:inline-block}
@media (max-width:900px){
  #app{display:flex;flex-direction:column;padding:6px}
  #hudLeft{display:contents}
  #topbar{order:1}
  #stageWrap{order:2}
  #controlPad{order:3}
  #storyBox{order:4}
  #resources{order:5}
  #toolsPanel{order:6}
  #overlay{position:fixed;z-index:40}
  .cardtop canvas{width:110px;height:73px}
}

body{touch-action:manipulation;-webkit-touch-callout:none}
#screen{margin:0 auto}
#overlay,#platformOverlay,#sysOverlay{align-items:flex-start}
#overlay .modal,#platformOverlay .modal,#sysOverlay .modal{margin:auto}
.pad small{font-size:11px;opacity:.8}
.pad button.hot{background:var(--accent);color:#04201a;animation:pulse 1s infinite}
@media (max-width:900px){
  body{padding-bottom:96px}
  #controlPad{position:fixed;left:0;right:0;bottom:0;z-index:30;background:transparent;border:0;padding:8px 10px calc(8px + env(safe-area-inset-bottom));pointer-events:none}
  #controlPad h3{display:none}
  .pad{display:flex;gap:10px;justify-content:flex-start}
  .pad button{pointer-events:auto;width:68px;height:68px;border-radius:50%;font-size:22px;padding:0;background:rgba(22,27,74,.82)}
  .pad button small{display:none}
  .pad button:nth-child(2){margin-right:auto}
  .pad button:nth-child(3){background:rgba(68,227,184,.25)}
}
@media (max-width:480px){.slot,.tile{width:27px;height:34px;font-size:17px}.slots,.tiles{gap:8px}.wordgrp{gap:3px}#topbar{font-size:13px}.tb-btns button{padding:5px 8px;font-size:12px}}
@media (max-height:500px) and (orientation:landscape){#screen{width:min(100%,calc((100vh - 80px)*16/9))}body{padding-bottom:0}#infoBar{font-size:12px;min-height:30px}}
</style>
</head>
<body>
<div id="app">
  <header id="topbar" class="panel">
    <div class="tb-btns">
      <button id="btnSettings" type="button">⚙ Settings</button>
      <button id="btnSound" type="button">🔊 Sound</button>
      <button id="btnMenu" type="button">☰ Menu</button>
    </div>
    <div id="stageLabel">Stage 0/9</div>
    <div id="sceneName">Scene 2: Mars</div>
  </header>

  <aside id="hudLeft">
    <section id="resources" class="panel">
      <h3>Resources</h3>
      <div id="resList"></div>
      <div id="dataCount">Data collected: <b id="dataNum">0/0</b></div>
    </section>
    <section id="controlPad" class="panel">
      <h3>Controls</h3>
      <div class="pad">
        <button type="button" data-k="left">◀<small> Left</small></button>
        <button type="button" data-k="right">▶<small> Right</small></button>
        <button type="button" data-k="jump">⤒<small> Jump</small></button>
        <button type="button" data-k="act">E<small> Scan / Dig</small></button>
      </div>
    </section>
  </aside>

  <main id="stageWrap">
    <div id="screen">
      <canvas id="game" width="480" height="270"></canvas>
      <div id="bubbleHud" aria-live="polite"><span class="bubbleAlien"></span><span class="bubbleEnglish"></span></div>
      <div id="overlay"></div>
      <div id="fade"></div>
      <div id="platformOverlay" hidden>
        <div class="modal">
          <h3 id="platformTitle"></h3>
          <div id="platformMount"></div>
          <p id="platformMsg" class="muted"></p>
          <div class="btnrow"><button id="platformClose" class="btn" type="button">Close</button></div>
        </div>
      </div>
    </div>
    <div id="objectiveBar" aria-live="polite">
      <span id="objectiveIcon" aria-hidden="true">◎</span>
      <span id="objectiveCopy"><span id="objectiveLabel">Explore the landing site</span><span id="objectiveMeta">Your next discovery will appear here.</span></span>
      <span id="objectiveDistance"></span>
    </div>
    <div id="infoBar"></div>
  </main>

  <aside id="toolsPanel" class="panel">
    <h3>Artifacts</h3>
    <div id="toolsList"></div>
  </aside>

  <section id="storyBox" class="panel">
    <div>
      <h3 id="storyTitle"></h3>
      <p id="storyText"></p>
    </div>
    <button id="storyBtn" class="btn primary" type="button" style="display:none">Continue</button>
  </section>
</div>

<div id="sysOverlay" hidden></div>

<script>

/* ============================================================
   2) Helpers
   ============================================================ */
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function lerp(a,b,t){ return a+(b-a)*t; }
function approach(v,target,amount){ return v<target?Math.min(v+amount,target):Math.max(v-amount,target); }
function easeOut(t){ return 1-(1-t)*(1-t); }
function easeIn(t){ return t*t; }
function $(id){ return document.getElementById(id); }
function on(el,ev,fn){ if(el) el.addEventListener(ev,fn); }
function h(tag,cls,text){

}

function makeSprite(rows,pal,scale){
  let w=0; rows.forEach(function(r){ if(r.length>w) w=r.length; });
  const c=document.createElement('canvas');
  c.width=w*scale; c.height=rows.length*scale;
  const g=c.getContext('2d');
  for(let y=0;y<rows.length;y++){
    const r=rows[y];
    for(let x=0;x<w;x++){
      const col=pal[r.charAt(x)];
      if(col){ g.fillStyle=col; g.fillRect(x*scale,y*scale,scale,scale); }
    }
  }
  return c;
}

const audio={ctx:null,on:true};
function initAudio(){
  if(audio.ctx) return;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC) audio.ctx=new AC();
  }catch(e){ audio.ctx=null; }
}
function beep(f,d,type,vol,slide){
  if(!audio.on||!audio.ctx) return;
  try{
    const c=audio.ctx, o=c.createOscillator(), g=c.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(f,c.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,c.currentTime+d);
    g.gain.setValueAtTime(vol||0.05,c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+d);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+d+0.02);
  }catch(e){}
}
function sfx(n){
  switch(n){
    case 'jump': beep(280,0.16,'square',0.04,640); break;
    case 'pick': beep(660,0.08,'triangle',0.06,990); setTimeout(function(){ beep(990,0.1,'triangle',0.05); },70); break;
    case 'ok': beep(523,0.1,'triangle',0.06); setTimeout(function(){ beep(659,0.1,'triangle',0.06); },110); setTimeout(function(){ beep(784,0.18,'triangle',0.06); },220); break;
    case 'err': beep(160,0.25,'sawtooth',0.05,90); break;
    case 'tile': beep(420,0.05,'square',0.03); break;
    case 'interact': beep(440,0.1,'triangle',0.06,880); break;
    case 'unlock': beep(800,0.12,'triangle',0.06,1200); break;
    default: break;
  }
}

function inGap(x,pad){
  for(let i=0;i<GAPS.length;i++){ if(x>GAPS[i].x-pad && x<GAPS[i].x+GAPS[i].w+pad) return true; }
  return false;
}
function buildWorld(){
  SOLIDS=[];
  const gaps=GAPS.slice().sort(function(a,b){ return a.x-b.x; });
  let x=0;
  gaps.forEach(function(g){ SOLIDS.push({x:x,y:CONFIG.groundY,w:g.x-x,h:60,ground:true}); x=g.x+g.w; });
  SOLIDS.push({x:x,y:CONFIG.groundY,w:CONFIG.worldWidth-x,h:60,ground:true});
  PLATFORMS_ROCK.forEach(function(pl){ SOLIDS.push({x:pl.x,y:pl.y,w:pl.w,h:8}); });
  // decor
  DECOR=[];
  const r=srand(7);
  for(let dx=40;dx<CONFIG.worldWidth;dx+=60+Math.floor(r()*90)){
    if(inGap(dx,50)) continue;
    let near=false;
    TOOLS_DATA.forEach(function(t){ if(Math.abs(t.x-dx)<60) near=true; });
    if(Math.abs(CONFIG.startX-dx)<50) near=true;
    if(near) continue;
    const k=r();
    DECOR.push({type:k<0.55?'rock':(k<0.85?'crater':'dune'),x:dx,s:1+Math.floor(r()*3)});
  }
  // stars
  STARS=[];
  for(let i=0;i<110;i++){ STARS.push({x:Math.floor(r()*CONFIG.W*3),y:Math.floor(r()*190),s:r()<0.2?2:1,tw:r()*6}); }
  // dust
  DUST=[];
  for(let j=0;j<36;j++){ DUST.push({x:r()*CONFIG.W,y:r()*CONFIG.H,vx:30+r()*50,s:1+Math.floor(r()*3),a:0.1+r()*0.2}); }
}

    if(i%3===1) PICKS.push({type:'solar',x:pl.x+pl.w/2,y:pl.y-14,got:false});
    else if(i%3===2) PICKS.push({type:'oxy',x:pl.x+pl.w/2,y:pl.y-14,got:false});

   7) Player
   ============================================================ */
function overlap(a,s){ return a.x<s.x+s.w && a.x+a.w>s.x && a.y<s.y+s.h && a.y+a.h>s.y; }
function updatePlayer(dt){
  const locked=state.inputLocked;
  let dir=0, wantJump=false, run=false;
  if(!locked){ dir=dirX(); wantJump=jumpHeld(); run=!!(keys.ShiftLeft||keys.ShiftRight); }
  let speed=run?CONFIG.runSpeed:CONFIG.walkSpeed;
  const tired=state.energy<=0;
  if(tired) speed*=CONFIG.tiredFactor;
  const accel=(dir?CONFIG.accel*(tired?0.72:1):CONFIG.friction)*(p.onGround?1:CONFIG.airControl);
  p.vx=approach(p.vx,dir*speed,accel*dt);
  if(dir!==0){
    if(p.face!==dir && Math.abs(p.vx)>36){ p.skidT=0.12; puff(p.x+4,p.y+16,3,35); }
    p.face=dir;
  }
  p.skidT=Math.max(0,(p.skidT||0)-dt);

  p.coyote=p.onGround?0.1:p.coyote-dt;
  if(wantJump && !p.jumpHeld) p.buf=0.1;
  p.jumpHeld=wantJump;
  p.buf-=dt;
  if(p.buf>0 && p.coyote>0){ p.vy=CONFIG.jump; p.buf=0; p.coyote=0; p.onGround=false; p.jumps=0; sfx('jump'); puff(p.x+4,p.y+16,4,40); if(Math.random()<0.12) sayKey('jump'); }
  else if(p.buf>0 && !p.onGround && p.jumps<1){ p.vy=CONFIG.jump*0.88; p.buf=0; p.jumps++; sfx('jump'); puff(p.x+4,p.y+16,6,60); }
  if(!wantJump && p.vy<-70) p.vy+=CONFIG.gravity*dt*2.2;

  const x0=p.x;
  p.x+=p.vx*dt;
  let i, s;
  for(i=0;i<SOLIDS.length;i++){
    s=SOLIDS[i];
    if(overlap(p,s)){ if(p.vx>0) p.x=s.x-p.w; else if(p.vx<0) p.x=s.x+s.w; }
  }
  p.x=clamp(p.x,0,CONFIG.worldWidth-p.w);
  const moved=Math.abs(p.x-x0);

  const nearApex=Math.abs(p.vy)<42;
  const gravityScale=p.vy>0?CONFIG.fallMultiplier:(nearApex?CONFIG.apexGravity:1);
  p.vy+=CONFIG.gravity*gravityScale*dt;
  if(p.vy>520) p.vy=520;
  p.y+=p.vy*dt;
  const wasG=p.onGround, vyB=p.vy;
  p.onGround=false;
  for(i=0;i<SOLIDS.length;i++){
    s=SOLIDS[i];
    if(overlap(p,s)){
      if(p.vy>0){ p.y=s.y-p.h; p.vy=0; p.onGround=true; }
      else if(p.vy<0){ p.y=s.y+s.h; p.vy=0; }
    }
  }
  if(p.onGround && !wasG && vyB>120) landFx(vyB);
  if(p.onGround) p.jumps=0;
  if(p.onGround){
    const cx=p.x+p.w/2;
    if(!inGap(cx,30)){ p.safeX=p.x; p.safeY=p.y; }
  }
  if(p.y>CONFIG.H+50){
    p.x=p.safeX; p.y=p.safeY; p.vy=0; p.vx=0; sayKey('fall');
    flash('Back at the last safe spot. Nothing lost 🙂',2.5);
  }
  if(dir!==0 && p.onGround) p.anim+=dt*8; else if(dir===0) p.anim=0;

  if(!locked){
    state.energy-=moved*CONFIG.energyPerPx;
    if(dir===0 && p.onGround) state.energy+=dt/CONFIG.energyRegenSec;
    state.energy=clamp(state.energy,0,10);
    state.oxygen=clamp(state.oxygen-dt/CONFIG.oxygenDrainSec,0,10);
    if(state.energy<=0 && !state.warnE){ state.warnE=true; flash('⚡ Energy depleted. You will move slower until you find a solar panel',3.5); }
    if(state.energy>=2) state.warnE=false;
    if(state.oxygen<=2 && !state.warnO){ state.warnO=true; flash('⚠ Oxygen low. Find an oxygen canister or interact with an artifact',3.5); }
    if(state.oxygen>3) state.warnO=false;
  }
}
function updatePickups(){
  const cx=p.x+p.w/2, cy=p.y+p.h/2;
  for(let i=0;i<PICKS.length;i++){
    const k=PICKS[i];
    if(k.got) continue;
    if(Math.abs(cx-k.x)<10 && Math.abs(cy-k.y)<14){
      k.got=true; sfx('pick'); sayKey(k.type==='solar'?'solar':'oxy');
      if(k.type==='solar'){ state.energy=clamp(state.energy+CONFIG.pickupEnergy,0,10); flash('⚡ Solar panel: +'+CONFIG.pickupEnergy+' energy',2.5); }
      else { state.oxygen=clamp(state.oxygen+CONFIG.pickupOxygen,0,10); flash('🫧 Oxygen canister: +'+CONFIG.pickupOxygen,2.5); }
    }
  }
}

function startUnlock(t){
  const idxs=[];
  t.fields.forEach(function(f,i){ if(f.locked && !fieldOpen(t,i)) idxs.push(i); });
  state.open[t.id]=state.open[t.id]||{};
  card.unlocking=true;
  if(!idxs.length){ finishUnlock(t); return; }
  idxs.forEach(function(idx,k){
    const id=setTimeout(function(){
      state.open[t.id][idx]=true; sfx('unlock'); renderHud(true);
      if(k===idxs.length-1) finishUnlock(t); else if(card.t===t) paintCard();
    },600+k*CONFIG.unlockStep);
    card.timers.push(id);
  });
}
function finishUnlock(t){
  state.unlocked[t.id]=true; card.unlocking=false;
  renderHud(true); renderTools();
  if(card.t===t) paintCard();
}
function clearCardTimers(){ card.timers.forEach(function(id){ clearTimeout(id); }); card.timers=[]; }
function closeCard(){
  if(!card.t) return;
  const t=card.t, adv=card.adv;
  clearCardTimers();
  if(card.unlocking){ card.t=null; finishUnlock(t); }
  card.t=null; card.adv=null; card.unlocking=false;
  const ov=$('overlay'); if(ov){ ov.classList.remove('show'); clearNode(ov); }
  state.inputLocked=false;
  if(adv){
    if(adv.final){ showEnding(); }
    else if(state.stage===6 && t.id==='ingenuity'){ beginDiscovery(); }
    else if(adv.then!==null && adv.then!==undefined){ goToStage(adv.then); }
    else { const s=STORY[state.stage]; if(s && s.after) renderStory(s.title,s.after); }
  }
  renderTools(); renderHud(true); renderObjective();
}

/* ============================================================
   10) Puzzle
   ============================================================ */
const puz={round:0,tiles:[],slots:[],words:[],sol:'',solved:false,locked:false,shake:false};
function startPuzzle(){
  state.puzzleStarted=true;
  state.inputLocked=true;
  puz.round=0;
  setupRound();
  const ov=$('overlay'); if(ov) ov.classList.add('show');
}
function setupRound(){
  const word=CONFIG.puzzleWords[puz.round].word.toUpperCase();
  puz.words=word.split(' ');
  puz.sol=puz.words.join('');
  puz.solved=false; puz.locked=false; puz.shake=false;
  resetPuzzleTiles();
  renderPuzzle();
}
function resetPuzzleTiles(){
  const letters=puz.sol.split('');
  let tries=0, shuffled;
  do{
    shuffled=letters.slice();
    for(let i=shuffled.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const tmp=shuffled[i]; shuffled[i]=shuffled[j]; shuffled[j]=tmp; }
    tries++;
  } while(shuffled.join('')===puz.sol && tries<20);
  puz.tiles=shuffled.map(function(ch){ return {ch:ch,used:false}; });
  puz.slots=[];
  for(let k=0;k<puz.sol.length;k++) puz.slots.push(-1);
}
function puzTile(i){
  if(puz.solved||puz.locked) return;
  if(puz.tiles[i].used) return;
  const s=puz.slots.indexOf(-1); if(s<0) return;
  puz.slots[s]=i; puz.tiles[i].used=true; sfx('tile');
  renderPuzzle();
  if(puz.slots.indexOf(-1)<0) checkPuzzle();
}
function puzSlot(s){
  if(puz.solved||puz.locked) return;
  const i=puz.slots[s]; if(i<0) return;
  puz.tiles[i].used=false; puz.slots[s]=-1; sfx('tile');
  renderPuzzle();
}
function puzHint(){
  if(puz.solved||puz.locked) return;
  let target=-1;
  for(let k=0;k<puz.sol.length;k++){
    const ti=puz.slots[k];
    if(ti<0 || puz.tiles[ti].ch!==puz.sol.charAt(k)){ target=k; break; }
  }
  if(target<0) return;
  if(puz.slots[target]>=0){ puz.tiles[puz.slots[target]].used=false; puz.slots[target]=-1; }
  const ch=puz.sol.charAt(target);
  let free=-1, i;
  for(i=0;i<puz.tiles.length;i++){ if(!puz.tiles[i].used && puz.tiles[i].ch===ch){ free=i; break; } }
  if(free<0){
    for(let j=0;j<puz.slots.length;j++){
      const ti=puz.slots[j];
      if(ti>=0 && puz.tiles[ti].ch===ch && puz.sol.charAt(j)!==ch){ puz.tiles[ti].used=false; puz.slots[j]=-1; free=ti; break; }
    }
  }
  if(free<0) return;
  puz.slots[target]=free; puz.tiles[free].used=true; sfx('tile');
  renderPuzzle();
  if(puz.slots.indexOf(-1)<0) checkPuzzle();
}
function checkPuzzle(){
  let str='';
  for(let k=0;k<puz.slots.length;k++) str+=puz.tiles[puz.slots[k]].ch;
  if(str===puz.sol){ puz.solved=true; sfx('ok'); renderPuzzle(); }
  else {
    puz.locked=true; puz.shake=true; sfx('err'); renderPuzzle();
    setTimeout(function(){ puz.shake=false; puz.locked=false; resetPuzzleTiles(); renderPuzzle(); },700);
  }
}
function renderPuzzle(){
  const ov=$('overlay'); if(!ov) return;
  clearNode(ov);
  const total=CONFIG.puzzleWords.length;
  const m=h('div','modal');
  m.appendChild(h('h2','','🔐 Letter Puzzle: Round '+(puz.round+1)+'/'+total));
  m.appendChild(h('p','muted',puz.solved?'✔ Correct! The code is right.':'Arrange the letters to form the phrase. Click a letter to place it in the first empty slot; click a slot to return it.'));
  const sb=h('div','slots'+(puz.solved?' ok':'')+(puz.shake?' shake':''));
  let k=0;
  puz.words.forEach(function(w){
    const grp=h('div','wordgrp');
    for(let j=0;j<w.length;j++){
      const idx=k;
      const b=h('button','slot'+(puz.slots[idx]>=0?' full':''));
      b.type='button';
      b.textContent=puz.slots[idx]>=0?puz.tiles[puz.slots[idx]].ch:'';
      b.addEventListener('click',function(){ puzSlot(idx); });
      grp.appendChild(b); k++;
    }
    sb.appendChild(grp);
  });
  m.appendChild(sb);
  const tb=h('div','tiles');
  puz.tiles.forEach(function(t,i){
    const b=h('button','tile'+(t.used?' used':''),t.ch);
    b.type='button';
    b.addEventListener('click',function(){ puzTile(i); });
    tb.appendChild(b);
  });
  m.appendChild(tb);
  if(puz.solved){
    m.appendChild(h('div','note','💡 '+CONFIG.puzzleWords[puz.round].fact));
    const br=h('div','btnrow');
    const nb=h('button','btn primary','Continue'); nb.type='button';
    nb.addEventListener('click',function(){
      if(puz.round<total-1){ puz.round++; setupRound(); }
      else finishPuzzle();
    });
    br.appendChild(nb); m.appendChild(br);
  } else {
    const br=h('div','btnrow');
    const hb=h('button','btn','💡 Hint'); hb.type='button';
    hb.addEventListener('click',puzHint);
    br.appendChild(hb); m.appendChild(br);
  }
  ov.appendChild(m);
}
function finishPuzzle(){
  const ov=$('overlay'); if(ov){ ov.classList.remove('show'); clearNode(ov); }
  goToStage(3);
}

   Extras: speech, senses, secrets, puffs
   ============================================================ */
function say(a,e){ state.bubble={a:a,e:e,age:0,dur:a.length/28+0.65+2.6,type:'speech'}; }
function think(key,a,e,priority){
  if(!state||state.mode!=='play'||card.t||state.puzzleStarted) return;
  const now=state.t, last=state.thoughtCooldown[key]||-999;
  if(now-last<18) return;
  state.thoughtCooldown[key]=now;
  const item={key:key,a:a,e:e,age:0,dur:Math.max(3.2,a.length/24+2.6),type:'thought',priority:priority||1};
  if(!state.bubble){ state.bubble=item; return; }
  if(state.bubble.type==='thought' && item.priority>state.bubble.priority){ state.thoughtQueue.unshift(state.bubble); state.bubble=item; }
  else if(state.thoughtQueue.length<2){ state.thoughtQueue.push(item); }
  state.thoughtQueue.sort(function(x,y){ return y.priority-x.priority; });
}
function sayKey(k){
  const L=SAY[k]; if(!L) return;
  if(state.bubble && (k==='jump'||k==='idle')) return;
  const m=L[Math.floor(Math.random()*L.length)]; say(m[0],m[1]);
}
function beginDiscovery(){
  state.discovery={t:0,first:false,second:false}; state.inputLocked=true; state.hitStop=(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)?0:0.15;
  if(navigator.vibrate) navigator.vibrate([10,30,10]);
  state.bubble=null; state.thoughtQueue=[];
  const bar=$('objectiveBar'); if(bar){ bar.classList.remove('pulse'); void bar.offsetWidth; bar.classList.add('pulse'); }
  beep(440,0.18,'triangle',0.06,880); setTimeout(function(){ beep(660,0.22,'triangle',0.05,1040); },110);
}
function resetGuidance(){
  state.guidance={lastDist:null,stuck:0,wrong:0,nudge:0,wrongSaid:false,arrived:{},walk:0,zone:-1,chevrons:false};
}
function updateGuidance(dt){
  if(state.mode!=='play'||state.inputLocked) return;
  const obj=OBJECTIVES[state.stage], target=obj?toolById(obj.tool):null;
  if(!target||!p.onGround) return;
  const cx=p.x+p.w/2, distance=Math.abs(cx-target.x), g=state.guidance;
  if(g.lastDist===null) g.lastDist=distance;
  const progress=g.lastDist-distance;
  if(progress>0.6){
    g.stuck=0; g.wrong=0;
    state.thoughtQueue=state.thoughtQueue.filter(function(item){return !item.key||item.key.indexOf('nudge-')!==0;});
    if(state.bubble&&state.bubble.key&&state.bubble.key.indexOf('nudge-')===0)state.bubble=null;
  }
  else if(Math.abs(p.vx)>8){ g.stuck+=dt; if((target.x-cx)*p.vx<0) g.wrong+=dt; else g.wrong=0; }
  else { g.stuck+=dt; g.wrong=0; }
  g.lastDist=distance;
  const zone=cx<900?0:(cx<1900?1:(cx<3000?2:(cx<4400?3:4)));
  if(g.zone<0) g.zone=zone;
  if(zone!==g.zone){
    g.zone=zone;
    const z=[['Kaa-thun dro mee.','A dry river once ran here.'],['Ur-ek vol… vol sha.','Flat, endless. Easy to hide things.'],['Thrr… nal-ko dren.','The ground is layered. Like pages.'],['Ven-ra sha tol… kesh un.','The quiet gets deeper out here.']][Math.max(0,zone-1)];
    if(z) think('zone-'+zone,z[0],z[1],1);
  }
  if(Math.abs(p.vx)>8 && p.onGround){ g.walk+=dt; if(g.walk>=5){g.walk=0;think('walk-long-'+state.stage,'Ven-ra sha tol… kesh un.','So far… and still nothing.',1);} }
  else g.walk=0;
  if(g.wrong>=6&&!g.wrongSaid){g.wrongSaid=true;think('wrong-'+state.stage,'Kaa… no.','Not that way.',2);}
  if(distance<200&&!g.arrived[state.stage]){g.arrived[state.stage]=true;think('arrive-'+state.stage,'Thrr… ven-ra hears me.','The machine is answering.',2);}
  if(g.stuck>=12&&g.nudge<1){g.nudge=1;think('nudge1-'+state.stage,'Nal-ko… the signal is faint.','Keep following the marker.',1);pulseObjective();}
  if(g.stuck>=25&&g.nudge<2){g.nudge=2;think('nudge2-'+state.stage,'Ka-run ven-thar.','A discovered machine can quick-link you closer.',2);pulseObjective();}
  if(g.stuck>=40&&g.nudge<3){g.nudge=3;g.chevrons=true;think('nudge3-'+state.stage,'Use the ven-thar.','I could use the quick-link to travel.',3);pulseObjective();}
  const bar=$('objectiveBar'); if(bar) bar.classList.toggle('stuck',g.stuck>=25);
  const travelButtons=document.querySelectorAll('[data-travel]');
  for(let i=0;i<travelButtons.length;i++) travelButtons[i].classList.toggle('hot',g.stuck>=25);
}
function pulseObjective(){const bar=$('objectiveBar');if(!bar)return;bar.classList.remove('pulse');void bar.offsetWidth;bar.classList.add('pulse');}
function renderBubbleDOM(){

  ctx.rotate(moving?p.face*0.06:0);
  ctx.scale((p.face<0?-sx:sx)*1.25,sy*1.25);
  ctx.drawImage(img,-w/2,-h);
  const blink=(state.t%3.6)<0.12;
  [[6,2],[4,3],[8,3]].forEach(function(e){
    const ex=-w/2+e[0], ey=-h+e[1];
    if(state.discovery&&state.discovery.t<0.8){ctx.fillStyle='#fff06a';ctx.fillRect(ex-1,ey-1,3,3);}
    else if(blink){ ctx.fillStyle='#7d3fae'; ctx.fillRect(ex,ey,1,1); }
    else if(state.sense>0.05){ ctx.fillStyle='rgba(255,240,106,'+(0.25+0.35*(0.5+0.5*Math.sin(state.t*10)))+')'; ctx.fillRect(ex-1,ey-1,3,3); }
  });
  ctx.restore();
  if(state.discovery&&state.discovery.t<0.9){ctx.fillStyle='#fff06a';ctx.font='bold 14px \"Courier New\",monospace';ctx.fillText('!',Math.round(p.x+p.w/2-2),Math.round(p.y-7));}
}
function drawWorld(){
  const GY=CONFIG.groundY, W=CONFIG.W, H=CONFIG.H;
  drawSky();
  drawRidge(CONFIG.parallax[1],176,16,'#4a2236',4);
  drawRidge(CONFIG.parallax[2],204,9,'#6e2f2c',4);
  const cx=Math.floor(cam.x);
  ctx.save(); ctx.translate(-cx,0);
  GAPS.forEach(function(g){ if(g.x+g.w>cx && g.x<cx+W){ ctx.fillStyle='#0b0612'; ctx.fillRect(g.x,GY,g.w,H-GY); } });
  SOLIDS.forEach(function(s){
    if(s.x+s.w<cx||s.x>cx+W) return;
    if(s.ground){
      ctx.fillStyle='#9a4130'; ctx.fillRect(s.x,s.y,s.w,s.h);
      ctx.fillStyle='#c4623f'; ctx.fillRect(s.x,s.y,s.w,3);
      ctx.fillStyle='#7d3326';
      const x0=Math.floor(Math.max(s.x,cx)/20)*20, x1=Math.min(s.x+s.w,cx+W);
      for(let x=x0;x<x1;x+=20){ const hs=(x*7919)%13; ctx.fillRect(x+hs,s.y+8+(hs%5)*6,3,2);ctx.fillStyle='#b9573b';ctx.fillRect(x+3,s.y+21+(hs%4)*4,7,1);ctx.fillStyle='#7d3326'; }
    } else {
      ctx.fillStyle='#8a3a2c'; ctx.fillRect(s.x,s.y,s.w,s.h);
      ctx.fillStyle='#c4623f'; ctx.fillRect(s.x,s.y,s.w,2);
      ctx.fillStyle='#5a2219'; ctx.fillRect(s.x,s.y+s.h-2,s.w,2);
    }
  });
  drawDecor(cx);
  drawPickups();
  drawSecrets();
  drawGuideChevrons();
  if(state.mode!=='landing'||state.lt>=CONFIG.landTime) drawLander(CONFIG.startX,GY-24,false);
  drawStations();
  drawScanBeam();
  drawArrow();
  drawPuffs();
  drawPlayer();
  ctx.restore();
}
function drawDust(){
  ctx.fillStyle='#d2784f';
  DUST.forEach(function(d){
    ctx.globalAlpha=d.a;
    ctx.fillRect(Math.floor(d.x),Math.floor(d.y),d.s*3,d.s);
  });
  ctx.globalAlpha=1;
}
function draw(){
  if(!ctx) return;
  ctx.imageSmoothingEnabled=false;
  const W=CONFIG.W, H=CONFIG.H;
  if(state.mode==='cine0'){
    drawSpaceBG(0);
    const a=clamp(state.t/2.5,0,1);
    drawPlanet(W/2,H/2,34+state.t*2,a);
    ctx.font='11px "Courier New", monospace';
    ctx.fillStyle='#44e3b8';
    const full='COORDS  '+CONFIG.coords;
    const n=Math.min(full.length,Math.floor(Math.max(0,state.t-1.5)*14));
    ctx.fillText(full.substring(0,n),14,H-14);
  } else if(state.mode==='zoom'){
    const pz=clamp(state.zt,0,1);
    drawSpaceBG(pz);
    drawPlanet(W/2,H/2,lerp(40,620,easeIn(pz)),1);
    if(pz>0.85){ ctx.fillStyle='#8a3c2e'; ctx.globalAlpha=(pz-0.85)/0.15; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
  } else if(state.mode==='landing'){
    drawWorld();
    const pl=clamp(state.lt/CONFIG.landTime,0,1);
    const ly=lerp(-50,CONFIG.groundY-24,easeOut(pl));
    if(pl<1){
      // The static lander is suppressed until the descending pod reaches the ground.
      drawLander(CONFIG.startX,ly,true);
    }
    drawDust();
  } else {
    drawWorld();
    drawDust();
  }
  if(state.debug){
    state.debugFps=state.debugFps?state.debugFps*.92+(1/Math.max(.001,lastFrameDt))*.08:(1/Math.max(.001,lastFrameDt));
    ctx.fillStyle='rgba(5,8,25,.82)';ctx.fillRect(5,5,74,13);ctx.fillStyle='#8ffff0';ctx.font='8px \"Courier New\",monospace';ctx.fillText('S'+state.stage+'  '+Math.round(state.debugFps)+' FPS',9,14);
    if(state.playerVisible){ctx.strokeStyle='#ffdf73';ctx.lineWidth=1;ctx.strokeRect(Math.round(p.x-cam.x),Math.round(p.y),p.w,p.h);}
  }
  if(state.mode==='play'){
    drawVignette(); drawEdgeArrow();
    if(state.discovery&&state.discovery.t<0.5&&!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)){ctx.save();ctx.strokeStyle='rgba(183,139,255,'+(0.45*(1-state.discovery.t/0.5))+')';ctx.lineWidth=10;ctx.strokeRect(4,4,W-8,H-8);ctx.restore();}
  }
  if(state.veilA>0){ ctx.globalAlpha=state.veilA; ctx.fillStyle=state.veilCol; ctx.fillRect(0,0,W,H); ctx.globalAlpha=1; }
}
/* ============================================================
   Update + Main loop
   ============================================================ */
function updateDust(dt){
  DUST.forEach(function(d){
    d.x+=d.vx*dt;
    if(d.x>CONFIG.W){ d.x=-6; d.y=Math.random()*CONFIG.H; }
  });
}
function nearestSignal(){
  if(state.signalBoost>0) return 10;
  const cx=p.x+p.w/2;
  let best=0;
  TOOLS_DATA.forEach(function(t){
    if(!isActive(t)) return;
    const d=Math.abs(cx-t.x);
    const v=10*clamp(1-(d-CONFIG.interactRadius)/260,0,1);
    if(v>best) best=v;
  });
  SECRETS.forEach(function(sc){ if(state.found[sc.id]) return; const v=10*clamp(1-(Math.abs(cx-sc.x)-24)/140,0,1); if(v>best) best=v; });
  return best;
}
function update(dt){
  if(state.paused)return;
  if(state.hitStop>0){state.hitStop=Math.max(0,state.hitStop-dt);return;}
  state.t+=dt;
  if(state.flashT>0) state.flashT-=dt;
  if(state.signalBoost>0) state.signalBoost-=dt;
  updateDust(dt);
  if(state.veilA>0 && state.mode!=='zoom'){
    state.veilA=Math.max(0,state.veilA-dt/1.2);
  }
  if(state.mode==='zoom'){
    state.zt+=dt/CONFIG.zoomTime;
    if(state.zt>=1) goToStage(2);
  } else if(state.mode==='landing'){
    state.lt+=dt;
    if(state.lt>=CONFIG.landTime && !state.puzzleStarted) startPuzzle();
  } else if(state.mode==='play'){
    if(state.discovery){
      state.discovery.t+=dt;
      if(state.discovery.t>=0.35&&!state.discovery.first){state.discovery.first=true;think('discovery-mark','Thrr-vek… sa-na kol!','The same mark… I saw it on the first machine!',4);}
      if(state.discovery.t>=2.7&&!state.discovery.second){state.discovery.second=true;state.bubble=null;think('discovery-return','Ka-run ven-thar. Nal-ko dren.','I must go back to the first one. Something is sealed there.',5);}
      if(state.discovery.t>=4.5){state.discovery=null;state.inputLocked=false;renderStory(STORY[6].title,'The repeated mark is a key. Return to Pathfinder; the objective is marked above.');}
    }
    updatePlayer(dt);
    if(!state.inputLocked) updatePickups();
    state.signal=nearestSignal(); updateExtras(dt);
    updateGuidance(dt);
    const held=!!(keys.KeyE||keys.Enter||touch.act);
    if(held&&!state.inputLocked&&(nearTool()||nearSecret(30))){
      actHold+=dt;
      if(actHold>=0.6){actHold=0;tryInteract();}
    }else actHold=0;
  } else if(state.mode==='end'){
    state.moonAlpha=Math.min(1,state.moonAlpha+dt*0.5);
  }
  if(state.mode==='play'||state.mode==='end'){
    const lead=CONFIG.camLead-p.face*CONFIG.lookAhead;
    const target=clamp(p.x-lead,0,CONFIG.worldWidth-CONFIG.W);
    cam.x+=(target-cam.x)*Math.min(1,dt*CONFIG.camSmooth);
  }
  renderHud(false);
  renderObjective();
  updateInfo();
}
let lastTs=0, lastFrameDt=1/60;
function loop(ts){
  if(!lastTs) lastTs=ts;
  const dt=state.paused?0:Math.min((ts-lastTs)/1000,0.05);
  if(dt>0)lastFrameDt=dt;
  lastTs=ts;
  try{ update(dt); draw(); }catch(e){ if(window.console) console.error(e); }
  requestAnimationFrame(loop);
}

/* ============================================================
   13) init
   ============================================================ */
function debugJumpStage(n){
  if(!state.debug||n<0||n>9)return;
  clearCardTimers();card.t=null;card.adv=null;card.unlocking=false;
  const ov=$('overlay');if(ov){ov.classList.remove('show');clearNode(ov);}
  state=newState();state.debug=true;
  state.visited={pathfinder:n>=4,viking1:n>=5,ingenuity:n>=6};
  state.unlocked={pathfinder:n>=7,viking1:n>=8,ingenuity:n>=9};
  if(n>=6)state.patternHL=true;
  if(n<3){goToStage(n);const introLabel=$('stageLabel');if(introLabel)introLabel.textContent='Stage '+n+'/9 · DEBUG';return;}
  state.stage=n;state.playerVisible=true;state.mode=n===9?'end':'play';state.inputLocked=false;
  resetPlayer();p.x=CONFIG.startX+36;
  if(n===4)p.x=1600;if(n===5||n===6)p.x=3400;if(n===7)p.x=2300;if(n===8)p.x=3500;if(n===9)p.x=CONFIG.worldWidth-100;
  p.safeX=p.x;p.safeY=p.y;cam.x=clamp(p.x-CONFIG.camLead,0,CONFIG.worldWidth-CONFIG.W);state.veilA=0;
  renderStory(STORY[n]?STORY[n].title:'Debug stage '+n,STORY[n]?STORY[n].text:'Debug ending');
  const sl=$('stageLabel');if(sl)sl.textContent='Stage '+n+'/9'+(state.debug?' · DEBUG':'');
  renderTools();renderHud(true);resetGuidance();renderObjective();
  if(n===9)showEnding();
}
function init(){
  canvas=$('game');
  if(canvas) ctx=canvas.getContext('2d');
  buildSprites();
  state=newState();
  buildWorld();
  buildPickups();
  resetPlayer();
  buildHud();
  bindTouch();
  actBtn=document.querySelector('#controlPad [data-k="act"]');
  document.addEventListener('keydown',function(e){
    if(state.debug&&e.altKey===false&&e.ctrlKey===false&&e.metaKey===false&&/^Digit[0-9]$/.test(e.code)){e.preventDefault();debugJumpStage(Number(e.code.slice(-1)));return;}
    if(state.debug&&e.code==='KeyN'){state.debugDusk=!state.debugDusk;return;}
    onKeyDown(e);
  });
  document.addEventListener('keyup',onKeyUp);
  document.addEventListener('visibilitychange',function(){if(document.hidden){state.paused=true;for(const k in keys)keys[k]=false;for(const k2 in touch)touch[k2]=false;}else state.paused=false;});
  window.addEventListener('blur',function(){ for(const k in keys) keys[k]=false; for(const k2 in touch) touch[k2]=false; });
  on($('storyBtn'),'click',function(){ initAudio(); if(storyCb) storyCb(); });
  on($('btnSound'),'click',function(){ initAudio(); toggleSound(); });
  on($('btnSettings'),'click',function(){ openSys('settings'); });
  on($('btnMenu'),'click',function(){ openSys('menu'); });
  on($('platformClose'),'click',function(){ const po=$('platformOverlay'); if(po) po.hidden=true; });
  document.addEventListener('pointerdown',initAudio);
  renderHud(true);
  if(state.debug){debugJumpStage(3);}else goToStage(0);
  requestAnimationFrame(loop);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
else init();

})();
</script>
