<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070b">
  <title>VOYAGER — Off-World</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f2f5fa;
      --muted: #8793a4;
      --faint: #4a5666;
      --blue: #4e9bff;
      --blue-bright: #78b4ff;
      --line: rgba(117, 164, 224, .18);
      --panel: #070a10;
    }
    * { box-sizing: border-box; }
    html { min-width: 320px; min-height: 100%; background: #05070b; }
    body {
      min-height: 100svh;
      margin: 0;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 77% 57%, rgba(18, 39, 69, .2), transparent 34rem),
        radial-gradient(ellipse at 10% 0%, rgba(12, 22, 39, .35), transparent 42rem),
        #05070b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, a { font: inherit; }
    .frame {
      position: relative;
      isolation: isolate;
      min-height: 100svh;
      margin: 13px;
      padding: 0 clamp(25px, 5vw, 76px);
      border: 1px solid rgba(76, 139, 219, .36);
      box-shadow: inset 0 0 36px rgba(21, 67, 125, .045), 0 0 34px rgba(15, 69, 133, .035);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .frame::before, .frame::after {
      content: "";
      position: absolute;
      z-index: -1;
      pointer-events: none;
    }
    .frame::before {
      inset: 0;
      opacity: .26;
      background-image: radial-gradient(rgba(191, 215, 246, .7) .65px, transparent .85px);
      background-size: 83px 97px;
      mask-image: linear-gradient(90deg, #000, transparent 75%);
    }
    .frame::after {
      width: min(56vw, 730px);
      aspect-ratio: 1;
      right: -13%;
      top: 12%;
      border-radius: 50%;
      background: radial-gradient(circle at 39% 34%, rgba(16, 29, 46, .19), rgba(8, 12, 19, .07) 54%, transparent 71%);
      filter: blur(9px);
    }
    .topbar {
      min-height: 91px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 34px;
      border-bottom: 1px solid rgba(177, 198, 224, .12);
    }
    .wordmark {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: #e7edf5;
      text-decoration: none;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 720;
      letter-spacing: .2em;
    }
    .mark {
      position: relative;
      width: 19px;
      height: 19px;
      border: 1px solid var(--blue);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(78, 155, 255, .16);
    }
    .mark::before {
      content: "";
      position: absolute;
      width: 7px;
      height: 7px;
      top: 5px;
      left: 5px;
      background: var(--blue-bright);
      border-radius: 50%;
      box-shadow: 0 0 9px rgba(120, 180, 255, .55);
    }
    .nav {
      display: flex;
      align-items: center;
      gap: clamp(19px, 3.6vw, 53px);
    }
    .nav a, .nav span {
      padding: 12px 0;
      color: #bdc6d2;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 9px;
      font-weight: 650;
      letter-spacing: .18em;
      transition: color .2s ease;
    }
    .nav a:hover, .nav a:focus-visible { color: var(--blue-bright); }
    .nav .current { color: var(--blue-bright); }
    .nav .unavailable { color: #46505e; cursor: not-allowed; }
    .nav .unavailable::after {
      content: "SOON";
      display: block;
      margin-top: 3px;
      color: #46505e;
      font-size: 6px;
      letter-spacing: .12em;
      text-align: center;
    }
    main {
      position: relative;
      display: flex;
      align-items: center;
      flex: 1;
      min-height: 555px;
      padding: 35px 0 57px;
    }
    .hero {
      position: relative;
      z-index: 2;
      width: min(690px, 68%);
      padding: 27px 0 7px;
    }
    .kicker, .micro-label {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 0;
      color: #8da4c1;
      font-size: 9px;
      line-height: 1.5;
      font-weight: 650;
      letter-spacing: .23em;
      text-transform: uppercase;
    }
    .kicker::before {
      content: "";
      width: 23px;
      height: 1px;
      background: var(--blue);
      box-shadow: 0 0 9px rgba(78, 155, 255, .55);
    }
    h1 {
      max-width: 750px;
      margin: 31px 0 23px;
      color: #f2f4f8;
      font-size: clamp(55px, 8vw, 111px);
      line-height: .91;
      font-weight: 560;
      letter-spacing: -.076em;
    }
    h1 span { display: block; }
    h1 .accent { color: #7caee9; }
    .intro {
      width: min(380px, 88%);
      margin: 0;
      color: #9aa5b4;
      font-size: 13px;
      line-height: 1.8;
      letter-spacing: .005em;
    }
    .cta-row {
      display: flex;
      align-items: center;
      gap: 19px;
      margin-top: 34px;
    }
    .enter {
      position: relative;
      min-width: 192px;
      min-height: 52px;
      padding: 0 23px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 17px;
      border: 1px solid rgba(141, 190, 250, .74);
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(110deg, #347de1, #2669c8 65%, #1e5db2);
      box-shadow: 0 0 25px rgba(48, 123, 221, .2), inset 0 1px rgba(255,255,255,.17);
      cursor: pointer;
      text-transform: uppercase;
      font-size: 9px;
      font-weight: 750;
      letter-spacing: .17em;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .enter:hover { transform: translateY(-2px); box-shadow: 0 5px 31px rgba(48, 123, 221, .34), inset 0 1px rgba(255,255,255,.2); }
    .enter:focus-visible { outline: 2px solid #d5e8ff; outline-offset: 4px; }
    .enter:active { transform: translateY(0); }
    .enter .arrow { font-size: 16px; font-weight: 400; line-height: 0; }
    .entry-note {
      margin: 0;
      color: #657184;
      font-size: 9px;
      line-height: 1.55;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .entry-note strong { display: block; color: #a4b1c1; font-weight: 600; }
    .status {
      min-height: 21px;
      margin: 16px 0 0;
      color: var(--blue-bright);
      font-size: 9px;
      font-weight: 650;
      letter-spacing: .17em;
      text-transform: uppercase;
    }
    .status:empty { visibility: hidden; }
    .world {
      position: absolute;
      z-index: 1;
      width: clamp(255px, 39vw, 535px);
      aspect-ratio: 1;
      top: 50%;
      right: clamp(-78px, 2vw, 42px);
      transform: translateY(-47%);
      pointer-events: none;
      opacity: .86;
    }
    .orbit {
      position: absolute;
      inset: 5% -7%;
      border: 1px solid rgba(76, 128, 193, .17);
      border-radius: 50%;
      transform: rotate(-24deg) scaleY(.47);
    }
    .orbit::after {
      content: "";
      position: absolute;
      top: 13%;
      left: 17%;
      width: 4px;
      height: 4px;
      background: #91c4ff;
      border-radius: 50%;
      box-shadow: 0 0 11px 3px rgba(91, 158, 235, .42);
    }
    .planet {
      position: absolute;
      width: 72%;
      aspect-ratio: 1;
      top: 12%;
      left: 10%;
      border-radius: 50%;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 28% 28%, rgba(157, 177, 195, .16), transparent 18%),
        radial-gradient(ellipse at 63% 70%, rgba(15, 31, 49, .8), transparent 36%),
        radial-gradient(circle at 34% 32%, #384b5c 0, #1d2b39 24%, #101a26 48%, #080d15 70%);
      box-shadow: inset -26px -7px 43px 7px rgba(0, 0, 0, .94), inset 7px 0 25px rgba(126, 165, 197, .12), 0 0 46px rgba(22, 54, 87, .17);
    }
    .planet::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      opacity: .37;
      background:
        radial-gradient(ellipse at 41% 47%, transparent 0 8%, rgba(117, 136, 149, .22) 8.3% 10%, transparent 10.5%),
        radial-gradient(ellipse at 33% 63%, rgba(6, 14, 23, .9) 0 12%, transparent 12.8%),
        radial-gradient(ellipse at 57% 32%, rgba(113, 132, 145, .25) 0 4%, transparent 4.8%),
        radial-gradient(ellipse at 24% 37%, rgba(149, 167, 179, .13) 0 16%, transparent 17%);
      filter: blur(6px);
    }
    .planet::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(100deg, transparent 36%, rgba(1, 4, 9, .14) 52%, rgba(0,0,0,.72) 100%);
    }
    .moon {
      position: absolute;
      z-index: 2;
      right: 9%;
      bottom: 21%;
      width: 8%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #a9b7c5, #677787 38%, #273746 76%);
      box-shadow: -6px 3px 17px rgba(0,0,0,.55), 0 0 18px rgba(115, 167, 218, .14);
    }
    .planet-caption {
      position: absolute;
      right: 2%;
      bottom: 7%;
      color: rgba(149, 168, 190, .64);
      font-size: 7px;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    .bottomline {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-top: 1px solid rgba(177, 198, 224, .12);
      color: #697587;
      font-size: 8px;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .beat-track { display: flex; align-items: center; gap: 9px; }
    .beat-count { margin-right: 6px; color: #9ba8b8; white-space: nowrap; }
    .beat {
      width: 23px;
      height: 2px;
      background: #263241;
    }
    .beat:first-of-type { background: var(--blue); box-shadow: 0 0 7px rgba(78,155,255,.43); }
    .coordinates { color: #586475; text-align: right; }
    @media (min-width: 1500px) { .frame { margin: 18px; } }
    @media (max-width: 760px) {
      .frame { margin: 8px; padding: 0 26px; }
      .topbar { min-height: 75px; gap: 14px; }
      .wordmark { font-size: 9px; gap: 8px; letter-spacing: .15em; }
      .mark { width: 16px; height: 16px; }
      .mark::before { top: 4px; left: 4px; }
      .nav { gap: clamp(12px, 3.2vw, 24px); }
      .nav a, .nav span { font-size: 8px; letter-spacing: .1em; }
      main { min-height: 600px; align-items: flex-start; padding-top: 107px; }
      .hero { width: 100%; padding-top: 0; }
      h1 { font-size: clamp(58px, 12vw, 88px); margin-top: 25px; }
      .world { width: min(68vw, 390px); top: auto; right: -19%; bottom: 2%; transform: none; opacity: .62; }
      .bottomline { min-height: 65px; }
      .coordinates { font-size: 7px; }
    }
    @media (max-width: 470px) {
      .frame { padding: 0 18px; }
      .topbar { min-height: 72px; }
      .wordmark { gap: 7px; font-size: 8px; }
      .nav { gap: 11px; }
      .nav a, .nav span { font-size: 7px; letter-spacing: .06em; }
      .nav .unavailable::after { font-size: 5px; }
      main { min-height: 590px; padding-top: 93px; }
      h1 { font-size: clamp(55px, 15vw, 71px); }
      .intro { font-size: 12px; }
      .cta-row { align-items: flex-start; flex-direction: column; gap: 13px; margin-top: 29px; }
      .enter { min-width: 184px; min-height: 50px; }
      .entry-note { font-size: 8px; }
      .world { width: 78vw; right: -28%; bottom: 0; opacity: .49; }
      .bottomline { min-height: 59px; font-size: 7px; letter-spacing: .1em; }
      .beat-track { gap: 5px; }
      .beat { width: 15px; }
      .beat-count { margin-right: 2px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header class="topbar">
      <a class="wordmark" href="#home" aria-label="Off-World, home">
        <span class="mark" aria-hidden="true"></span><span>OFF-WORLD</span>
      </a>
      <nav class="nav" aria-label="Primary navigation">
        <a href="#home" class="current" aria-current="page">Home</a>
        <a href="#mission">Mission</a>
        <span class="unavailable" aria-disabled="true" title="Data access coming later">Data</span>
        <span class="unavailable" aria-disabled="true" title="About coming later">About</span>
      </nav>
    </header>

    <main id="home">
      <div class="world" aria-hidden="true">
        <div class="orbit"></div>
        <div class="planet"></div>
        <div class="moon"></div>
        <span class="planet-caption">Earth · last known</span>
      </div>

      <section class="hero" id="mission" aria-labelledby="headline">
        <p class="kicker">OFF-WORLD · MISSION 01 / 05</p>
        <h1 id="headline"><span>VOYAGER</span></h1>
        <p class="intro">The first chapter in an interactive Off-World story.</p>
        <div class="cta-row">
          <button class="enter" id="enterVoyager" type="button">
            <span>Enter the mission</span><span class="arrow" aria-hidden="true">↗</span>
          </button>
          <p class="entry-note"><strong>Flight status</strong><span id="flightStatus">Awaiting authorization</span></p>
        </div>
        <p class="status" id="entryMessage" aria-live="polite" role="status"></p>
      </section>
    </main>

    <footer class="bottomline" aria-label="Mission progress">
      <div class="beat-track" aria-label="Scene 1 of 5">
        <span class="beat-count">01 <span aria-hidden="true">/</span> 05</span>
        <span class="beat" aria-hidden="true"></span><span class="beat" aria-hidden="true"></span>
        <span class="beat" aria-hidden="true"></span><span class="beat" aria-hidden="true"></span>
        <span class="beat" aria-hidden="true"></span>
      </div>
      <span class="coordinates">Deep space · transmission pending</span>
    </footer>
  </div>
  <script>
    (() => {
      const button = document.getElementById('enterVoyager');
      const flightStatus = document.getElementById('flightStatus');
      const message = document.getElementById('entryMessage');
      let entered = false;

      function enterVoyager() {
        if (entered) return;
        entered = true;
        flightStatus.textContent = 'Voyager is listening';
        message.textContent = 'ENTRY LOGGED · SIGNAL PATH OPEN';
        button.innerHTML = '<span>Voyager armed</span><span class="arrow" aria-hidden="true">✓</span>';
        button.setAttribute('aria-label', 'Voyager armed. Signal path open.');
        button.classList.add('armed');
      }

      button.addEventListener('click', enterVoyager);
      button.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          enterVoyager();
        }
      });
    })();
  </script>
</body>
</html>
